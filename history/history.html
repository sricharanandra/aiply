<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aiply History</title>
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Generation History</h1>
      <div class="header-actions">
        <input type="search" id="searchInput" placeholder="Search history...">
        <button id="exportBtn" class="btn-secondary">Export</button>
        <button id="importBtn" class="btn-secondary">Import</button>
        <input type="file" id="importFile" accept=".json" style="display: none;">
        <button id="clearBtn" class="btn-danger">Clear All</button>
      </div>
    </header>

    <main id="historyList" class="history-list">
      <div class="loading">Loading history...</div>
    </main>

    <div id="emptyState" class="empty-state" style="display: none;">
      <p>No history yet. Generate some answers to see them here.</p>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detailModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Details</h2>
        <button class="modal-close" id="closeModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="detail-section">
          <label>Question</label>
          <div id="detailQuestion" class="detail-text"></div>
        </div>
        <div class="detail-section" id="detailSourceSection" style="display: none;">
          <label>Source</label>
          <div id="detailSource" class="detail-text detail-source"></div>
        </div>
        <div class="detail-section" id="detailCompanySection">
          <label>Company</label>
          <div id="detailCompany" class="detail-text"></div>
        </div>
        <div class="detail-section" id="detailJDSection">
          <label>Job Description</label>
          <div id="detailJD" class="detail-text"></div>
        </div>
        <div class="detail-section" id="detailQuestionsListSection" style="display: none;">
          <label>Questions & Answers (<span id="detailQuestionCount">0</span>)</label>
          <div id="detailQuestionsList" class="detail-questions-list"></div>
        </div>
        <div class="detail-section" id="detailAnswerSection">
          <label>Generated Answer</label>
          <div id="detailAnswer" class="detail-text answer"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="copyAnswerBtn" class="btn-primary">Copy Answer</button>
        <button id="deleteEntryBtn" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="history.js"></script>
</body>
</html>
